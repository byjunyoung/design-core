# A consumer app example: the same format, ios screens. See DESIGN.md §6 for how platforms draw.
meta:
  language: en
naming:
  screen_pattern: '^[\p{L}\p{N}-]+$'
  section_pattern: null
platforms:
  default: ios
states:
  known: [ Default, Empty, Loading, Error, Validation, Selected, Refreshing ]
  required:
    feed: [ Default, Empty, Loading, Error ]
    detail: [ Default, Loading, Error ]
    sheet: [ Default ]
layout:
  containers: [ stack, grid, columns, row ]
  spacing_tokens: 'space.'
  size_classes: [ sm, md, lg, full ]
flows:
  gestures: [ tap, swipe-left, swipe-right, swipe-down, long-press, back, pull ]
  navs: [ push, modal, sheet, tab, replace, dismiss ]
refs:
  required: []
  schemes: [ notion, github, figma, file, https ]
lifecycle:
  canonical_branch: main
  handoff_requires: [ 'lint:blocking=0' ]
edit:
  auto_apply: [ text ]
