# conventions.yaml — the rules one team writes for itself.
# Every value here is an example, not a default. A key left null or empty
# switches that check off rather than firing on a file that does things differently.

meta:
  language: en                         # the viewer's own words (en | ko); screen content is never translated

naming:
  screen_pattern: '^[\p{L}\p{N}-]+$'   # letters and digits in any script, plus '-'. No '.', because flow targets are split on the last '.'
  section_pattern: null                # example: '^\d{2}\. .+ - .+$'
  frame_pattern: null                  # import figma: how a frame name splits into screen and state; default '^(.+)-([^-\s]+)$'
  scaffold_patterns: null              # import figma: frames to skip; null = ['^\[label\] ', '^\[state\] ', ' --> ', ' ~ ']

pages:
  exclude_sections: []                 # import figma: sections to skip, e.g. ['^Archived$', '^\[?[Aa]rchive']

platforms:                             # what a screen is drawn as; a screen says `platform:`, else `default`
  default: web
  web:     { width: 1280, frame: none }
  ios:     { width: 390, height: 844, frame: phone }
  android: { width: 412, height: 915, frame: phone }
  tablet:  { width: 1024, height: 768, frame: tablet }
  kiosk:   { width: 1080, height: 1920, frame: kiosk }

flows:                                 # the words a flow may use; lint warns on anything else
  gestures: [tap, swipe-left, swipe-right, swipe-down, swipe-up, long-press, back, pull]
  navs: [push, modal, sheet, tab, replace, dismiss]

states:
  known: [Default, Empty, Loading, Error, Validation, Selected]
  required:                            # per screen type; a type with no row gets no check
    list:   [Default, Empty, Loading, Error]
    form:   [Default, Validation]
    search: [Default, Empty]

kinds:                                 # the bundled set; a kind not listed here still renders, as a labeled box
  page-header:  { anchors: [action, tab] }
  group:        { }                    # a bare container, e.g. a button row; layout decides how it sits
  card:         { }
  section:      { }
  fieldset:     { }
  button:       { maps_to: { antd: Button, mui: Button } }
  filter-bar:   { }
  filter-form:  { maps_to: { antd: Form } }
  segmented:    { maps_to: { antd: Segmented, mui: ToggleButtonGroup } }
  table:        { anchors: [row, header], maps_to: { antd: Table, mui: Table } }
  pagination:   { maps_to: { antd: Pagination, mui: Pagination } }
  detail-card:  { maps_to: { antd: Descriptions, mui: Table } }
  kv-table:     { maps_to: { antd: Descriptions, mui: Table } }
  empty-notice: { maps_to: { antd: Empty, mui: Alert } }
  error-notice: { maps_to: { antd: Result, mui: Alert } }
  skeleton:     { maps_to: { antd: Skeleton, mui: Skeleton } }
  overlay:      { maps_to: { antd: Spin, mui: CircularProgress } }
  toast:        { maps_to: { antd: message, mui: Alert } }
  modal:        { maps_to: { antd: Modal, mui: Card } }
  confirm:      { maps_to: { antd: Modal.confirm, mui: Card } }
  field:        { }
  input:        { maps_to: { antd: Input, mui: TextField } }
  number:       { maps_to: { antd: InputNumber, mui: TextField } }
  textarea:     { maps_to: { antd: Input.TextArea, mui: TextField } }
  select:       { maps_to: { antd: Select, mui: TextField } }
  radio:        { maps_to: { antd: Radio.Group, mui: RadioGroup } }
  date:         { maps_to: { antd: DatePicker, mui: TextField } }
  date-range:   { maps_to: { antd: DatePicker.RangePicker, mui: TextField } }
  upload:       { maps_to: { antd: Upload, mui: Button } }
  tabs:         { anchors: [tab] }
  nav:          { anchors: [item] }
  checkbox:     { maps_to: { antd: Checkbox, mui: Checkbox } }
  switch:       { maps_to: { antd: Switch, mui: Switch } }
  tag:          { maps_to: { antd: Tag, mui: Chip } }
  caption:      { }
  hint:         { }
  divider:      { maps_to: { antd: Divider, mui: Divider } }
  stat-strip:   { maps_to: { antd: Statistic } }
  tooltip:      { maps_to: { antd: Tooltip, mui: Tooltip } }
  image:        { }
  tile:         { }                    # one status tile; an import writes repeat: N for a run of them
  tile-grid:    { anchors: [tile] }
  # mobile — present in both iOS HIG and Material, so they ship by name
  app-bar:      { anchors: [back, action] }
  tab-bar:      { anchors: [tab] }
  list-cell:    { anchors: [cell] }
  bottom-sheet: { anchors: [handle] }
  fab:          { }
  snackbar:     { maps_to: { mui: Alert } }
  chip:         { maps_to: { antd: Tag, mui: Chip } }
  search-bar:   { maps_to: { antd: Input, mui: TextField } }
  segment:      { anchors: [option], maps_to: { antd: Segmented, mui: ToggleButtonGroup } }
  stepper:      { anchors: [plus, minus] }
  pull-to-refresh: { }
  sheet-handle: { }

render:
  base: none                           # what mapped kinds are drawn with: none (self-built) | antd | … (see `design-core bases`)
  components: null                     # self-built: a module exporting `kinds`, e.g. ./components/kinds.js (init copies the bundled set there)

layout:
  containers: [stack, grid, columns]
  spacing_tokens: 'space.'             # prefix: only names starting with this may appear in gap/padding
  size_classes: [sm, md, lg, full]

refs:
  required: []                         # example: [prd]
  schemes: [notion, github, figma, file, https]

lifecycle:
  canonical_branch: main
  handoff_requires: ['lint:blocking=0']

edit:
  auto_apply: [text]
