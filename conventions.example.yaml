# conventions.yaml — the rules one team writes for itself.
# Every value here is an example, not a default. A key left null or empty
# switches that check off rather than firing on a file that does things differently.

naming:
  screen_pattern: '^[a-z0-9-]+$'      # no '.', because flow targets are split on the last '.'
  section_pattern: null                # example: '^\d{2}\. .+ - .+$'

states:
  known: [Default, Empty, Loading, Error, Validation, Selected]
  required:                            # per screen type; a type with no row gets no check
    list:   [Default, Empty, Loading, Error]
    form:   [Default, Validation]
    search: [Default, Empty]

kinds:                                 # a kind not listed here still renders with the bundled default
  page-header:  { anchors: [action] }
  group:        { }                    # a bare container, e.g. a button row; layout decides how it sits
  button:       { maps_to: { antd: Button } }
  filter-form:  { maps_to: { antd: Form } }
  table:        { anchors: [row, header], maps_to: { antd: Table } }
  pagination:   { maps_to: { antd: Pagination } }
  detail-card:  { maps_to: { antd: Descriptions } }
  empty-notice: { maps_to: { antd: Empty } }
  error-notice: { maps_to: { antd: Result } }
  skeleton:     { maps_to: { antd: Skeleton } }

render:
  base: none                           # what mapped kinds are drawn with: none (self-built) | antd | … (see `design-core bases`)
  components: null                     # self-built: a module exporting `kinds`, e.g. ./components/kinds.js (init copies the bundled set there)

layout:
  containers: [stack, grid, columns]
  spacing_tokens: 'space.'             # prefix: only names starting with this may appear in gap/padding
  size_classes: [sm, md, lg, full]

refs:
  required: []                         # example: [prd]
  schemes: [notion, github, figma, file, https]

lifecycle:
  canonical_branch: main
  handoff_requires: ['lint:blocking=0']

edit:
  auto_apply: [text]
